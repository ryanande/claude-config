      #    - PREPASS_APP_PRIVATE_KEY  (PEM, same App as arch-rover)
      #
      # 3) Decide commit-vs-PR for the digest. Recommend: direct commit to
      #    main on a private repo (this one). Cheaper than PR for a daily.
      # ─────────────────────────────────────────────────────────────

      - name: Run digest (dry-run stub)
        run: |
          chmod +x routines/pr-intelligence/runner.sh
          ./routines/pr-intelligence/runner.sh --dry-run > /tmp/composed.md
          echo "Dry-run composed prompt — replace with real invocation when ready."
          head -40 /tmp/composed.md

