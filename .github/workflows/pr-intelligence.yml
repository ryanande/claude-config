name: PR Intelligence

# 07:30 America/Phoenix (MST, UTC−7; Arizona does not observe DST) → 14:30 UTC
# Weekdays only.
on:
  schedule:
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Override date (YYYY-MM-DD) for backfill'
        required: false
        type: string

permissions:
  contents: write       # commit digest to repo
  pull-requests: write  # if we switch to PR-based publish later

jobs:
  digest:
    name: PR Intelligence digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ─────────────────────────────────────────────────────────────
      # TODO — wire this up before enabling the schedule.
